id: w01d6_kucuk_karinca
day: 6  # Cumartesi
format: short
hook: >-
  Agile Mind Cartoons ("Big Elephant, Tiny Ants") — değerler masalı: büyük sorun, küçük kahraman,
  "kimse yardım için çok küçük değildir" mesajı, 45–60 sn, anlatıcı sesi.
title:
  tr: "Minik Mimi Yardıma Koşuyor! 🐜❤️ Kimse çok küçük değil | Lulu & Bobo #shorts"
  en: "Tiny Mimi to the Rescue! 🐜❤️ No One Is Too Small to Help | Lulu & Bobo #shorts"
description:
  tr: "Lulu'nun balonu ağaca takıldı! Bobo Baba bile ulaşamıyor. Peki minik karınca Mimi ne yapacak? Yardımlaşmanın gücünü anlatan kısa bir masal. 🎈🐜"
  en: "Lulu's balloon is stuck in a tree! Even Daddy Bobo can't reach it. What will tiny Mimi do? A short story about the power of helping. 🎈🐜"
tags:
  tr: [masal, yardımlaşma, çocuk hikayeleri, değerler eğitimi, lulu ve bobo]
  en: [kids story, helping others, moral story, bedtime story, lulu and bobo]
thumbnail: >-
  mimi_ant tiny heroically holding a red balloon string on a tree branch, lulu_hedgehog cheering below,
  plain sky blue background
music:
  style: "gentle storybook music, music box, soft strings, warm, 90 bpm, instrumental with heroic moment"
  duration: 50
  lyrics: {tr: "[instrumental]", en: "[instrumental]"}
scenes:
  - dur: 6
    chars: [lulu]
    image: happy holding a red balloon in a sunny park with a big tree
    motion: gust of wind, the balloon string slips from lulu's hand and floats into the tree branches
    sub: {tr: "Eyvah! Balonum! 🎈", en: "Oh no! My balloon! 🎈"}
  - dur: 6
    chars: [lulu, bobo]
    image: bobo stretching tall on tiptoes reaching up to the tree, balloon stuck high
    motion: bobo stretches and jumps a little but cannot reach, scratches his head
    sub: {tr: "Bobo Baba bile ulaşamıyor! 🐻", en: "Even Daddy Bobo can't reach! 🐻"}
  - dur: 6
    chars: [zipzip]
    image: zipzip jumping toward the tree branch
    motion: zipzip hops high but bounces off a leaf and lands softly on the grass, giggling
    sub: {tr: "Zıpzıp da olmadı! 🐸", en: "Zippy can't either! 🐸"}
  - dur: 6
    chars: [mimi, lulu]
    image: tiny mimi standing on lulu's shoulder, determined face, looking up at tree
    motion: mimi raises her tiny arm, i can help, lulu looks surprised
    sub: {tr: "Mimi: Ben yardım edebilirim! 🐜", en: "Mimi: I can help! 🐜"}
  - dur: 8
    chars: [mimi]
    image: tiny mimi climbing up the tree bark, close up, sunlight through leaves
    motion: mimi climbs the bark quickly, walks along a branch to the tangled balloon string
    sub: {tr: "Tırman Mimi, tırman! 🌳", en: "Climb, Mimi, climb! 🌳"}
  - dur: 6
    chars: [mimi]
    image: mimi untangling the red balloon string from a twig
    motion: mimi pulls the string free, the balloon floats gently down
    sub: {tr: "Başardı! ✨", en: "She did it! ✨"}
  - dur: 6
    chars: [lulu, bobo, zipzip, mimi]
    image: lulu holding the balloon, all friends hugging mimi in the park
    motion: everyone cheers and hugs, mimi blushes happily
    sub: {tr: "Kimse yardım etmek için çok küçük değil! ❤️", en: "No one is too small to help! ❤️"}
  - dur: 6
    chars: [lulu, mimi]
    image: lulu tying the balloon gently to mimi's tiny backpack, sunset park
    motion: balloon bobs above mimi, both wave goodbye to camera
    sub: {tr: "Teşekkürler Mimi! 👋", en: "Thank you, Mimi! 👋"}
