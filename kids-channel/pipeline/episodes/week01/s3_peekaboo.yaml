    description:
      en: "One, two, three... peekaboo! Full song on Lulu & Bobo."
      es: "Uno, dos, tres... ¡cu-cú! Canción completa en Lulu y Bobo."
      pt: "Um, dois, três... achou! Música completa em Lulu e Bobo."
    tags:
      en: [peekaboo, baby, giggles, shorts]
      es: [cucú, bebé, risas, shorts]
      pt: [achou, bebê, risadas, shorts]
