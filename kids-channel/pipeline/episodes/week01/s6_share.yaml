    sections: [verse3, chorus]
    title:
      en: "Rain, rain... share my umbrella! ☔🌈 #shorts #nurseryrhymes"
      es: "Lluvia, lluvia... ¡comparto mi paraguas! ☔🌈 #shorts #cancionesinfantiles"
      pt: "Chuva, chuva... divido meu guarda-chuva! ☔🌈 #shorts #musicainfantil"
    description:
      en: "Friends together, side by side! Full song on Lulu & Bobo."
      es: "¡Amigos juntos, siempre unidos! Canción completa en Lulu y Bobo."
