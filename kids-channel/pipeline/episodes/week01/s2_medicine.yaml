  outro:
    - {chars: [lulu, bobo, zipzip], beats: 12, image: "friends waving at camera, a friendly stop sign badge on lulu's overalls", motion: "everyone waves bye-bye and smiles"}
lyrics:
  en:
    verse1: ["Lulu found a bottle on the kitchen shelf,", "Little pink dots, she wants one for herself!", "Pink and round, they look like sweets,", "Are they candy? Are they treats?"]
    chorus: ["Stop! Stop! That's not candy!", "Medicine is not for play!", "Ask a grown-up, ask a grown-up,", "That's the safe and healthy way!"]
    verse2: ["Daddy Bobo says, “Lulu, wait!", "Medicine helps when we're sick, but it's not food for your plate.", "Only grown-ups give it, in a tiny spoon,", "When the doctor says so, you'll feel better soon!”"]
    verse3: ["Now Lulu knows the rule, she tells Zippy too:", "“Don't touch the bottles, here is what to do:", "Find a grown-up, point and say,", "Medicine is not for play!”"]
  es:
    verse1: ["Lulu encontró un frasco en la cocina,", "Bolitas de colores, ¡qué cosa tan fina!", "Rosaditas y redondas como dulces,", "¿Serán caramelos? ¿Me los como? ¡Ups!"]
    chorus: ["¡Alto, alto! ¡No es un dulce!", "¡La medicina no es para jugar!", "Pide ayuda a un adulto,", "¡Así nos vamos a cuidar!"]
    verse2: ["Papá Bobo llega y dice: “¡Lulu, espera!", "La medicina es para cuando uno se enferma de veras.", "Solo un adulto te la da con cucharita,", "Y cuando el doctor lo dice, te sientes bien prontito.”"]
    verse3: ["Ahora Lulu sabe, y le cuenta a Zipi:", "“No toques los frascos, escucha aquí:", "Busca a un adulto y dile así:", "¡La medicina no es para jugar!”"]
  pt:
    verse1: ["Lulu achou um vidrinho na cozinha,", "Bolinhas coloridas, que coisinha!", "Rosinhas e redondas como doces,", "Será que é bala? Será que eu posso?"]
    chorus: ["Pare! Pare! Isso não é doce!", "Remédio não é pra brincar!", "Chame um adulto, chame um adulto,", "É assim que vamos nos cuidar!"]
    verse2: ["Papai Bobo chega e diz: “Lulu, espera!", "Remédio é só quando a gente está doente de verdade.", "Só um adulto te dá, numa colherzinha,", "Quando o médico manda, você melhora rapidinho!”"]
    verse3: ["Agora Lulu sabe e conta pro Zipi:", "“Não mexa nos vidrinhos, escuta aqui:", "Procure um adulto e diga assim:", "Remédio não é pra brincar!”"]
