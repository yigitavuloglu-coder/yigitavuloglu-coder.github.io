    - {chars: [lulu], image: "lulu thinking, a thought bubble with candies", motion: "lulu licks her lips and tilts her head", sing: true}
    - {chars: [lulu], image: "lulu holding the closed bottle, puzzled face", motion: "lulu shakes the bottle gently, it rattles, she looks at the camera"}
  chorus:
    - {chars: [bobo], image: "bobo raising a big gentle hand like a stop sign, kind but serious face", motion: "bobo raises his hand, a big friendly red stop sign appears", sing: true}
    - {chars: [lulu, bobo], image: "bobo kneeling and gently taking the bottle from lulu", motion: "bobo puts the bottle high on a shelf, shakes his head kindly"}
    - {chars: [lulu, bobo], image: "lulu holding bobo's hand, both looking at the camera", motion: "lulu nods, bobo points to himself as the grown-up", sing: true}
    - {chars: [lulu, bobo], image: "bobo hugging lulu in the kitchen, hearts around", motion: "they hug, little hearts float up", sing: true}
  verse2:
    - {chars: [bobo], image: "bobo crouching at lulu's eye level, explaining with a warm smile", motion: "bobo talks gently and holds one finger up", sing: true}
    - {chars: [lulu], image: "lulu in bed with a little cold, red nose, blanket", motion: "lulu sneezes softly, a tissue floats"}
    - {chars: [lulu, bobo], image: "bobo giving lulu syrup with a small measuring spoon", motion: "bobo carefully pours a tiny spoon, lulu takes it", sing: true}
    - {chars: [lulu], image: "lulu feeling better, jumping on the bed with sunshine", motion: "lulu smiles brightly and stretches, sun shines in"}
  verse3:
    - {chars: [lulu, zipzip], image: "lulu talking to zipzip in a playroom", motion: "lulu explains, waving her finger like a teacher", sing: true}
    - {chars: [zipzip], image: "zipzip looking at a closed bottle on a table with curious eyes", motion: "zipzip stops and pulls his hands back"}
    - {chars: [lulu, zipzip], image: "lulu and zipzip running to bobo and pointing at the bottle", motion: "they run and point together", sing: true}
