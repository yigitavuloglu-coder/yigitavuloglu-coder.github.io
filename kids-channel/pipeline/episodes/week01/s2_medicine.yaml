id: s2_medicine_not_candy
type: song
hook: >-
  Güvenlik masalı: More Good Stories "¡Eso No Es Dulce! Las Medicinas No Son Dulces" (69 günde 92K abone,
  günde ~1,8M izlenme, ES). "Dur!" anı kanca; mesaj: ilaç yalnızca bir yetişkinle.
bpm: 100
style: "children's story song, gentle piano, pizzicato, playful woodblock, warm female vocal, 100 bpm, clear lyrics"
structure: [intro, verse1, chorus, verse2, chorus, verse3, chorus, outro]
title:
  en: "Medicine Is Not Candy! 💊🚫 Safety Song for Kids | Lulu & Bobo"
  es: "¡La Medicina No Es Un Dulce! 💊🚫 Canción de Seguridad | Lulu y Bobo"
  pt: "Remédio Não É Doce! 💊🚫 Música de Segurança | Lulu e Bobo"
description:
  en: "Lulu finds colorful pills that look like candy. Stop! Medicine is not for play. Always ask a grown-up. A safety song for little ones."
  es: "Lulu encuentra pastillas de colores que parecen dulces. ¡Alto! La medicina no es para jugar. Siempre pide ayuda a un adulto."
  pt: "Lulu encontra comprimidos coloridos que parecem doces. Pare! Remédio não é pra brincar. Sempre chame um adulto."
tags:
  en: [safety song, medicine safety, kids safety, good habits, nursery rhymes, lulu and bobo]
  es: [canción de seguridad, medicinas, seguridad para niños, buenos hábitos, lulu y bobo]
  pt: [música de segurança, remédio, segurança infantil, bons hábitos, lulu e bobo]
thumbnail: "lulu_hedgehog reaching toward a medicine bottle with pink pills, bobo_bear holding up a big hand saying stop, red stop sign icon, plain soft yellow background"
